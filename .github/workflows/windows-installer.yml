name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  # Publishing a GitHub Release builds the installer and attaches it to that release.
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Reuse Electron and electron-builder downloads between builds (fewer network failures, faster builds).
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install dependencies (retries on network errors)
        shell: bash
        run: npm ci || (sleep 30 && npm ci) || (sleep 90 && npm ci) || (sleep 180 && npm ci)

      - name: Check types and run tests
        run: |
          npm run lint
          npm test

      - name: Build installer (.exe) (retries on network errors)
        shell: bash
        run: npm run dist:win || (sleep 60 && npm run dist:win) || (sleep 180 && npm run dist:win)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PaperMind-AI-Setup
          path: release/*.exe
          if-no-files-found: error

      - name: Attach installer to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: release/*.exe
